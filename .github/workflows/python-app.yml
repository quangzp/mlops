# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI/CD Pipeline

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # CI
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup Python & Cache
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      # Install Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Lint & Format
      - name: Lint and Format with Ruff
        run: |
          ruff check .
          ruff format --check .

      # Unit Test
      - name: Test with pytest
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_MODE: disabled
        run: |
          pytest tests/

  # Model Evaluation
  evaluate-model:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # Pull LFS files if using Git LFS for data/models

      # Setup Python & Cache
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      # Install Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install scikit-image  # For SSIM/PSNR metrics

      # Download DVC data (if using DVC)
      - name: Pull data with DVC
        run: |
          if [ -f dvc.yaml ]; then
            pip install dvc[s3]
            # dvc pull  # Uncomment if DVC remote is configured
          fi
        continue-on-error: true

      # Prepare minimal dataset for evaluation
      - name: Prepare data
        run: |
          if [ ! -d "data/processed/images" ] || [ ! -d "data/processed/sketches" ]; then
            echo "No processed data found. Running data preparation..."
            python mlops/download_and_prepare_data.py || echo "Data preparation skipped"
          fi
        continue-on-error: true

      # Train a small model for evaluation (if no checkpoint exists)
      - name: Train model (if needed)
        env:
          WANDB_MODE: disabled
        run: |
          if [ ! -f "models/checkpoints/generator_latest.pth" ]; then
            echo "No model checkpoint found. Training a minimal model for evaluation..."
            # Train for just 1-2 epochs for CI/CD
            python mlops/modeling/train.py training.num_epochs=2 training.batch_size=2 || echo "Training skipped"
          else
            echo "Using existing checkpoint for evaluation"
          fi
        continue-on-error: true

      # Run Model Evaluation
      - name: Evaluate model
        env:
          WANDB_MODE: disabled
        run: |
          echo "Running model evaluation..."
          python mlops/modeling/evaluate.py || echo "Evaluation completed with warnings"

      # Upload evaluation artifacts
      - name: Upload evaluation metrics
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-metrics
          path: |
            reports/evaluation_metrics.json
            reports/metrics.json
          if-no-files-found: warn

      - name: Upload sample images
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-samples
          path: reports/samples/
          if-no-files-found: warn

      # Display metrics in logs
      - name: Display evaluation results
        run: |
          if [ -f "reports/evaluation_metrics.json" ]; then
            echo "=== EVALUATION METRICS ==="
            cat reports/evaluation_metrics.json
            echo "=========================="
          fi

      # Model validation - check if metrics meet threshold
      - name: Validate model quality
        run: |
          python - <<'EOF'
          import json
          import sys
          from pathlib import Path

          metrics_path = Path("reports/evaluation_metrics.json")

          if not metrics_path.exists():
              print("⚠️  No evaluation metrics found. Skipping validation.")
              sys.exit(0)

          with open(metrics_path) as f:
              metrics = json.load(f)

          # Define quality thresholds
          SSIM_THRESHOLD = 0.3  # Minimum acceptable SSIM (0-1 scale)
          PSNR_THRESHOLD = 10.0  # Minimum acceptable PSNR (dB)

          ssim = metrics.get("ssim_mean", 0)
          psnr = metrics.get("psnr_mean", 0)

          print(f"📊 Model Quality Check:")
          print(f"   SSIM: {ssim:.4f} (threshold: {SSIM_THRESHOLD})")
          print(f"   PSNR: {psnr:.2f} dB (threshold: {PSNR_THRESHOLD})")

          if ssim < SSIM_THRESHOLD:
              print(f"❌ SSIM {ssim:.4f} is below threshold {SSIM_THRESHOLD}")
              sys.exit(1)

          if psnr < PSNR_THRESHOLD:
              print(f"❌ PSNR {psnr:.2f} is below threshold {PSNR_THRESHOLD}")
              sys.exit(1)

          print("✅ Model quality validation passed!")
          EOF

  # CD
  build-push-docker:
    needs: [test-and-lint, evaluate-model]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker system prune -af
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sketch2image-mlops:latest
